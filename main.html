<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Help Desk - Panel Zgłoszeń</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900 antialiased">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
        <div class="p-5 text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="life-buoy" class="text-indigo-400"></i> HelpDesk
        </div>
        <nav class="flex-1 px-4 space-y-1">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-600 text-white font-medium">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
          </a>
        </nav>
      </aside>

      <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6">
          <h1 class="text-xl font-semibold text-slate-800">
            Przegląd zgłoszeń
          </h1>
          <button onclick="otworzFormularz()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 shadow-sm transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Nowe zgłoszenie
          </button>
        </header>

        <div class="p-6 max-w-7xl w-full mx-auto space-y-6">
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
              <p class="text-sm font-medium text-slate-500">Otwarte zgłoszenia</p>
              <h3 id="licznik-otwarte" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
              <p class="text-sm font-medium text-slate-500">W trakcie realizacji</p>
              <h3 id="licznik-w-toku" class="text-3xl font-bold text-amber-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
              <p class="text-sm font-medium text-slate-500">Rozwiązane dziś</p>
              <h3 id="licznik-rozwiazane" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
            </div>
          </div>

          <div id="panel-dodawania" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hidden">
            <h3 class="text-lg font-bold mb-4 text-slate-800">Dodaj nowe zgłoszenie</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
              <input type="text" id="input-temat" placeholder="Temat zgłoszenia..." class="border p-2 rounded-lg text-sm" />
              <input type="text" id="input-klient" placeholder="Imię i nazwisko klienta..." class="border p-2 rounded-lg text-sm" />
              <select id="input-status" class="border p-2 rounded-lg text-sm">
                <option value="Otwarte">Otwarte</option>
                <option value="W toku">W toku</option>
                <option value="Rozwiązane">Rozwiązane</option>
              </select>
              <select id="input-priorytet" class="border p-2 rounded-lg text-sm">
                <option value="Niski">Niski</option>
                <option value="Średni">Średni</option>
                <option value="Wysoki">Wysoki</option>
                <option value="Krytyczny">Krytyczny</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button onclick="dodajZgloszenie()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Zapisz</button>
              <button onclick="zamknijFormularz()" class="bg-gray-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium">Anuluj</button>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100 font-semibold text-slate-700">
              Ostatnie tickety
            </div>
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                  <th class="p-4">ID</th>
                  <th class="p-4">Temat</th>
                  <th class="p-4">Klient</th>
                  <th class="p-4">Status</th>
                  <th class="p-4">Priorytet</th>
                </tr>
              </thead>
              <tbody id="tabela-cialo" class="divide-y divide-slate-100 text-sm">
              </tbody>
            </table>
          </div>

        </div>
      </main>
    </div>

    <script>
      let zgloszenia = [
        { id: "#TK-1092", temat: "Nie działa resetowanie hasła", klient: "Jan Kowalski", status: "W toku", priorytet: "Wysoki" },
        { id: "#TK-1091", temat: "Błąd płatności kartą", klient: "Anna Nowak", status: "Rozwiązane", priorytet: "Średni" },
        { id: "#TK-1090", temat: "Problem z logowaniem", klient: "Piotr Zieliński", status: "Otwarte", priorytet: "Krytyczny" }
      ];

      function odswiezWidok() {
        let tbody = document.getElementById("tabela-cialo");
        tbody.innerHTML = ""; 

        let ileOtwarte = 0;
        let ileWToku = 0;
        let ileRozwiazane = 0;

        for (let i = 0; i < zgloszenia.length; i++) {
          let z = zgloszenia[i];

          if (z.status === "Otwarte") ileOtwarte++;
          if (z.status === "W toku") ileWToku++;
          if (z.status === "Rozwiązane") ileRozwiazane++;

          let kolorStatusu = "bg-slate-100 text-slate-800";
          if (z.status === "W toku") kolorStatusu = "bg-amber-100 text-amber-800";
          if (z.status === "Rozwiązane") kolorStatusu = "bg-emerald-100 text-emerald-800";

          let kolorPriorytetu = "text-slate-600";
          if (z.priorytet === "Średni") kolorPriorytetu = "text-amber-600 font-medium";
          if (z.priorytet === "Wysoki") kolorPriorytetu = "text-orange-600 font-medium";
          if (z.priorytet === "Krytyczny") kolorPriorytetu = "text-red-600 font-bold";

          let wiersz = `
            <tr class="hover:bg-slate-50">
              <td class="p-4 font-medium text-indigo-600">${z.id}</td>
              <td class="p-4">${z.temat}</td>
              <td class="p-4 text-slate-600">${z.klient}</td>
              <td class="p-4"><span class="${kolorStatusu} text-xs px-2.5 py-1 rounded-full font-medium">${z.status}</span></td>
              <td class="p-4 ${kolorPriorytetu}">${z.priorytet}</td>
            </tr>
          `;
          tbody.innerHTML += wiersz;
        }

        document.getElementById("licznik-otwarte").innerText = ileOtwarte;
        document.getElementById("licznik-w-toku").innerText = ileWToku;
        document.getElementById("licznik-rozwiazane").innerText = ileRozwiazane;
      }

      function otworzFormularz() {
        document.getElementById("panel-dodawania").classList.remove("hidden");
      }

      function zamknijFormularz() {
        document.getElementById("panel-dodawania").classList.add("hidden");
      }

      function dodajZgloszenie() {
        let temat = document.getElementById("input-temat").value;
        let klient = document.getElementById("input-klient").value;
        let status = document.getElementById("input-status").value;
        let priorytet = document.getElementById("input-priorytet").value;

        if (temat === "" || klient === "") {
          alert("Wypełnij temat i klienta!");
          return;
        }

        let nowe = {
          id: "#TK-" + (1090 + zgloszenia.length + 1),
          temat: temat,
          klient: klient,
          status: status,
          priorytet: priorytet
        };

        zgloszenia.unshift(nowe);

        odswiezWidok();

        document.getElementById("input-temat").value = "";
        document.getElementById("input-klient").value = "";
        zamknijFormularz();
      }

      window.onload = function() {
        odswiezWidok();
        lucide.createIcons();
      };
    </script>
  </body>
</html>
